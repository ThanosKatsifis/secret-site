<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Μυστικό Κουμπί</title>
  <style>
    body {
      background-color: black;
      color: orange;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding-top: 100px;
    }
    input {
      font-size: 20px;
      text-align: center;
      padding: 5px;
    }
    button {
      font-size: 18px;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: orange;
      border: none;
      cursor: pointer;
    }
    #secretLink {
      display: none;
      margin-top: 20px;
      font-size: 20px;
      color: orange;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>Μάντεψε τον 3ψήφιο κωδικό</h2>
  <input type="password" id="codeInput" maxlength="3">
  <br>
  <button onclick="checkCode()">Υποβολή</button>
  <br>
  <a id="secretLink" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">👉 Πάτα εδώ για το μυστικό</a>

  <script>
    function checkCode() {
      var input = document.getElementById("codeInput").value;
      if (input === "683") {
        document.getElementById("secretLink").style.display = "inline";
      } else {
        alert("Λάθος κωδικός! Προσπάθησε ξανά.");
      }
    }
  </script>
</body>
</html>
